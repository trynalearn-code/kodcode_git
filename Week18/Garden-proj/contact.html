            <div class="link">
                <a href="index.html">Home</a>
                <a class="active" href="contact.html">Contact</a>
            </div>
        </nav>
        
        <main>
    <h1 class="title">Contact Us</h1>

    <section class="info">
        <div class="store">
            <p class="item">Address</p><strong class="detail">23 Al Hapanim Street</strong>
        </div>
        <div class="store">
            <p class="item">Hours</p><strong class="detail">9:00-5:00</strong>
        </div>
        <div class="store">
            <p class="item">Friday</p><strong class="detail">9:00-2:00</strong>
        </div>
        <div class="store">
            <p class="item">Phone</p><strong class="detail">052-FLOWERS</strong>
        </div>
    </section>

        <h2 class="recommended">Leave your details. We'll get back to you</h2>
        <p>Unsure which plan is good for you? Send us your deatails with any questions. We'll give you our personalized service.</p>
            <form class="inputs">
                <div> 
                    <label for="name">Full Name</label>
                    <input type="text" placeholder="Example: Micha'el Gardener" name="name" id="name" class="input" required>
                </div> 
                <div>
                    <label for="subject">How can we help?</label>
                    <select name="subject" id="subject" required>
                        <option value="">Choose a suject</option>
                        <option value="plant">Help choosing a plant</option>
                        <option value="loc">Help finding us</option>
                        <option value="order">Help about an order</option>
                        <option value="other">Something else</option>
                    </select>
                    
                </div> 
                <div>
                    <label for="email">email</label>
                    <input type="email" placeholder="you@example.com" name="email" id="email" class="input" required>
                </div>
                <div>
                    <label for="about">Tell us all about it!</label>
                    <textarea name="about" placeholder="For example: I just wanted to thank you for the most exquisite flowers I've ever seen! She was so impressed she said yes before I even proposed!" id="about" class="input" required></textarea>
                </div>
                <button class="btn">Send</button>
            </form>
    </main>

</body>
</html>
